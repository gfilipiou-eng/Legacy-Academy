<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Filippos Tailakidis — Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --gold: #c5a059;
            --gold-bright: #ffe3aa;
            --text: #e9e9e9;
            --bg: #000;
            --card: #0a0a0a;
            --nav-h: 80px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding-top: var(--nav-h);
            overflow-x: hidden;
        }
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: rgba(0,0,0,0.98);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(197,160,89,0.2);
            z-index: 10000;
            display: flex;
            align-items: center;
        }
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            height: 50px;
            filter: drop-shadow(0 0 10px rgba(197,160,89,0.35));
        }
        .menu { display: flex; gap: 24px; list-style: none; }
        .menu a {
            color: white;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }
        main {
            max-width: 1200px;
            margin: 30px auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 50px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--gold-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bio {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 40px;
            border: 1px solid rgba(197,160,89,0.12);
        }
        .bio h2 { color: var(--gold); font-size: 1.15rem; margin-bottom: 10px; text-transform: uppercase; }
        .bio p { color: #bbb; line-height: 1.65; font-size: 1.05rem; }
        .gallery-header {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .gallery-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            background: #111;
            border-radius: 8px;
            transition: transform 0.35s ease;
        }
        .gallery-item:hover {
            transform: scale(1.03);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(197,160,89,0.2);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            position: sticky;
            top: 100px;
            height: fit-content;
        }
        .badge {
            background: var(--gold);
            color: #000;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 25px;
            display: inline-block;
        }
        .photo-wrap {
            position: relative;
            width: 140px; height: 140px;
            margin: 0 auto 20px;
        }
        .gold-ring {
            position: absolute; inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from var(--rot, 0deg), var(--gold), transparent, var(--gold-bright), transparent, var(--gold));
            animation: rotate 3s linear infinite;
        }
        @property --rot { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
        @keyframes rotate { from { --rot: 0deg; } to { --rot: 360deg; } }
        .profile-photo {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
            border: 3px solid #000;
        }
        .name { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
        .role { color: var(--gold); font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; margin-bottom: 28px; }
        .socials { display: flex; flex-direction: column; gap: 12px; }
        .social-pill {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 13px; border-radius: 10px; background: rgba(255,255,255,0.05);
            color: white; text-decoration: none; font-weight: 700; font-size: 0.9rem;
            border: 1px solid rgba(197,160,89,0.15);
            transition: 0.3s;
        }
        .social-pill:hover { background: var(--gold); color: #000; transform: translateX(6px); }
        .modal {
            position: fixed; inset: 0; background: #000;
            display: none; align-items: center; justify-content: center; z-index: 100000;
        }
        .modal.show { display: flex; }
        .modal img { max-width: 100%; max-height: 100vh; object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 32px; color: #fff; cursor: pointer; }

        /* MOBILE - Instagram exact grid */
        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                padding: 0;
                margin: 0;
            }
            h1, .bio, .gallery-header {
                padding: 0 16px;
                text-align: center;
            }
            .gallery {
                gap: 0;
                width: 100vw;
                margin-left: calc(-50vw + 50%);
                margin-right: calc(-50vw + 50%);
            }
            .gallery-item {
                border-radius: 0;
            }
            .gallery-item:hover img { transform: scale(1.02); }
            .card {
                position: static;
                margin: 30px 16px;
                border-radius: 0;
            }
            h1 { font-size: 2.2rem; }
            .logo { height: 42px; }
        }
    </style>
</head>
<body>
<nav>
    <div class="nav-inner">
        <img src="image/Logo.png" class="logo" alt="Logo">
        <ul class="menu">
            <li><a href="index.html">HOME</a></li>
            <li><a href="index.html#apply">APPLY</a></li>
            <li><a href="portfolio.html">PORTFOLIO</a></li>
        </ul>
    </div>
</nav>
<main>
    <section>
        <h1>FILIPPOS TAILAKIDIS</h1>
        <div class="bio">
            <h2>Bio</h2>
            <p>
                Founder & Developer focusing on high-end digital experiences. Obsessed with detail, clean code, and elegant design.
            </p>
        </div>
        <div class="gallery-header">
            <i class="fas fa-th"></i> Gallery
        </div>
      
        <div class="gallery">
            <div class="gallery-item" onclick="openModal('image/gallery1.jpg')">
                <img src="image/gallery1.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item" onclick="openModal('image/gallery2.jpg')">
                <img src="image/gallery2.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item" onclick="openModal('image/gallery3.jpg')">
                <img src="image/gallery3.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item" onclick="openModal('image/gallery4.jpg')">
                <img src="image/gallery4.jpg" alt="" loading="lazy">
            </div>
            <div class="gallery-item" onclick="openModal('image/gallery5.jpg')">
                <img src="image/gallery5.jpg" alt="" loading="lazy">
            </div>
        </div>
    </section>
    <aside class="card">
        <div class="badge">FOUNDER</div>
        <div class="photo-wrap">
            <div class="gold-ring"></div>
            <img src="image/filip.jpg" class="profile-photo" alt="Filippos">
        </div>
        <div class="name">FILIPPOS TAILAKIDIS</div>
        <div class="role">Founder · Programmer</div>
        <div class="socials">
            <a class="social-pill" href="https://open.spotify.com" target="_blank"><i class="fab fa-spotify"></i> Spotify</a>
            <a class="social-pill" href="https://www.tiktok.com/@filippos_tailakidis" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
            <a class="social-pill" href="https://www.instagram.com/tailakidis_" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
            <a class="social-pill" href="https://youtube.com/@filippostailakidis_" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
            <a class="social-pill" href="mailto:filippostailakidis@outlook.de"><i class="fas fa-envelope"></i> Email</a>
        </div>
    </aside>
</main>
<div class="modal" id="modal">
    <span class="modal-close" onclick="closeModal()">✕</span>
    <img id="modalImg" src="">
</div>
<script>
    function openModal(src) {
        const m = document.getElementById("modal");
        const img = document.getElementById("modalImg");
        img.src = src;
        m.classList.add("show");
        document.body.style.overflow = 'hidden';
    }
    function closeModal() {
        const m = document.getElementById("modal");
        m.classList.remove("show");
        document.body.style.overflow = 'auto';
    }
    document.getElementById("modal").addEventListener("click", function(e) {
        if (e.target === this) closeModal();
    });
</script>
</body>
</html>
