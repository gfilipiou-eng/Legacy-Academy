<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Filippos Tailakidis — Portfolio</title>
    
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --gold: #c5a059;
            --red: #ff0000;
            --verify-blue: #0095f6;
            --bg: #000000;
            --card: #0c0c0c;
            --nav-h: 100px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: var(--bg); color: #e9e9e9; font-family: 'Inter', sans-serif; padding-top: var(--nav-h); overflow-x: hidden; }

        /* --- BACKGROUND --- */
        .bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; overflow: hidden; }
        .bg-gradient::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(255, 0, 0, 0.08) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255, 0, 0, 0.08) 1.5px, transparent 1.5px);
            background-size: 60px 60px; transform: perspective(500px) rotateX(60deg); animation: gridMove 12s linear infinite;
        }
        @keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(60px); } }

        /* --- NAVIGATION --- */
        nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10000; display: flex; align-items: center; }
        .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 25px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 65px; }
        .nav-menu { display: flex; gap: 35px; list-style: none; }
        .nav-menu a { color: #fff; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }
        .menu-toggle { display: none; color: var(--red); font-size: 22px; cursor: pointer; }

        /* --- MAIN LAYOUT --- */
        main { max-width: 1200px; margin: 40px auto 60px; padding: 0 20px; display: grid; grid-template-columns: 400px 1fr; gap: 50px; }

        /* --- INTERACTIVE 3D CARD --- */
        .card-container { perspective: 2000px; position: sticky; top: 130px; z-index: 100; }
        .card { 
            background: var(--card); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 40px; 
            padding: 50px 30px; 
            text-align: center; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        .role-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 30px; transform: translateZ(40px); }
        .role-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 4px 12px; border-radius: 4px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
        .role-badge.primary { background: var(--red); border-color: var(--red); }

        .profile-wrapper { position: relative; width: 150px; height: 150px; margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; transform: translateZ(80px); }
        .circle-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-svg circle { fill: none; stroke: var(--red); stroke-width: 3; stroke-dasharray: 440; opacity: 0.6; }

        .profile-photo { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #000; position: relative; z-index: 2; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

        /* --- ULTRA 3D VERIFY BADGE --- */
        .name-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 25px; transform: translateZ(60px); }
        .card-name { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 900; color: #fff; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        .verify-badge-3d { 
            width: 22px; 
            height: 22px; 
            background: linear-gradient(135deg, #4cb5f9 0%, #0095f6 100%);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            transform: translateZ(20px);
            border: 2px solid #fff;
            box-shadow: 
                0 5px 15px rgba(0, 149, 246, 0.4),
                inset 0 -3px 5px rgba(0,0,0,0.2),
                inset 0 3px 5px rgba(255,255,255,0.3);
        }
        .verify-badge-3d i { color: #fff; font-size: 11px; }

        /* --- SOCIAL BUTTONS --- */
        .socials { display: flex; flex-direction: column; gap: 12px; transform: translateZ(30px); }
        .social-pill { 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            padding: 15px; border-radius: 18px; background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.08); color: white; text-decoration: none; 
            font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; 
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 rgba(0,0,0,0.4);
        }
        
        .social-pill:active { transform: translateY(4px) translateZ(10px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }

        .social-pill.email-btn { 
            background: var(--gold); color: #000; font-weight: 900; border: none;
            box-shadow: 0 5px 0 #8a6d3b, 0 10px 20px rgba(197, 160, 89, 0.2);
        }
        .social-pill.email-btn:active { box-shadow: 0 1px 0 #8a6d3b; background: #e0b970; }

        /* --- CONTENT --- */
        h1 { font-family: 'Montserrat', sans-serif; font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 900; margin-bottom: 30px; letter-spacing: -2px; }
        .bio { background: rgba(255, 255, 255, 0.02); border-radius: 30px; padding: 45px; margin-bottom: 50px; border-left: 5px solid var(--red); }
        .bio p { color: #aaa; line-height: 1.9; font-size: 1.1rem; }

        .gallery-header { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.1rem; color: #fff; text-transform: uppercase; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .gallery-header::after { content: ""; flex: 1; height: 1px; background: rgba(255, 0, 0, 0.15); }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .gallery-item { aspect-ratio: 1 / 1; overflow: hidden; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.3s; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-item:hover img { transform: scale(1.1); }

        /* --- MOBILE --- */
        @media (max-width: 900px) {
            nav { height: 80px; } .logo { height: 50px; }
            .menu-toggle { display: block; }
            .nav-menu { display: none; position: absolute; top: 80px; left: 0; width: 100%; background: #000; flex-direction: column; padding: 40px; border-bottom: 2px solid var(--red); }
            .nav-menu.active { display: flex; }
            main { grid-template-columns: 1fr; margin-top: 0; }
            .card-container { position: relative; top: 0; margin: 20px 10px 50px; }
            .card { transform: rotateX(5deg) !important; }
            h1 { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <nav>
        <div class="nav-inner">
            <img src="image/Logo.png" class="logo" alt="Logo">
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="index.html#packages">ACADEMY</a></li>
                <li><a href="index.html#apply">APPLY</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="card-container" id="cardContainer">
            <aside class="card" id="tiltCard">
                <div class="role-badges">
                    <span class="role-badge primary">Founder</span>
                    <span class="role-badge">Visionary</span>
                    <span class="role-badge">Entrepreneur</span>
                </div>
                
                <div class="profile-wrapper">
                    <svg class="circle-svg" viewBox="0 0 150 150">
                        <circle cx="75" cy="75" r="72"></circle>
                    </svg>
                    <img src="image/filip.jpg" class="profile-photo" alt="Filippos">
                </div>
                
                <div class="name-container">
                    <div class="card-name">FILIPPOS</div>
                    <div class="verify-badge-3d">
                        <i class="fas fa-check"></i>
                    </div>
                </div>
                
                <div class="socials">
                    <a class="social-pill" href="http://googleusercontent.com/spotify.com/5" target="_blank">
                        <i class="fab fa-spotify"></i> Spotify
                    </a>
                    <a class="social-pill" href="https://www.tiktok.com/@filippos_tailakidis" target="_blank">
                        <i class="fab fa-tiktok"></i> TikTok
                    </a>
                    <a class="social-pill" href="https://www.instagram.com/tailakidis_" target="_blank">
                        <i class="fab fa-instagram"></i> Instagram
                    </a>
                    <a class="social-pill email-btn" href="mailto:filippostailakidis@outlook.de">
                        <i class="fas fa-envelope"></i> Email Me
                    </a>
                </div>
            </aside>
        </div>

        <section>
            <h1>FILIPPOS TAILAKIDIS</h1>
            <div class="bio">
                <p>Entrepreneur and code visionary, founder of Legacy Academy. I build legacy-grade systems that bridge strategic engineering with uncompromising design.</p>
            </div>
            <div class="gallery-header"><i class="fas fa-camera-retro"></i> Gallery</div>
            <div class="gallery">
                <div class="gallery-item"><img src="image/gallery1.jpg"></div>
                <div class="gallery-item"><img src="image/gallery2.jpg"></div>
                <div class="gallery-item"><img src="image/gallery3.jpg"></div>
                <div class="gallery-item"><img src="image/gallery4.jpg"></div>
                <div class="gallery-item"><img src="image/gallery5.jpg"></div>
            </div>
        </section>
    </main>

    <script>
        function toggleMenu() { document.getElementById("navMenu").classList.toggle("active"); }

        // --- DYNAMIC 3D TILT ENGINE ---
        const card = document.getElementById('tiltCard');
        const container = document.getElementById('cardContainer');

        if (window.innerWidth > 900) {
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (centerY - y) / 12;
                const rotateY = (x - centerX) / 12;
                
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            container.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });
        }
    </script>
</body>
</html>
