<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Filippos Tailakidis — Portfolio</title>
    
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --gold: #c5a059;
            --red: #ff0000;
            --verify-blue: #0095f6;
            --bg: #000000;
            --card: rgba(15, 15, 15, 0.85); /* Glass effect */
            --nav-h: 100px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: var(--bg); color: #e9e9e9; font-family: 'Inter', sans-serif; padding-top: var(--nav-h); overflow-x: hidden; }

        /* --- BACKGROUND --- */
        .bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        .bg-gradient::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(255, 0, 0, 0.1) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1.5px, transparent 1.5px);
            background-size: 60px 60px; transform: perspective(500px) rotateX(60deg); animation: gridMove 15s linear infinite;
        }
        @keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(60px); } }

        /* --- NAVIGATION --- */
        nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10000; display: flex; align-items: center; }
        .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 25px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 65px; }
        .nav-menu { display: flex; gap: 35px; list-style: none; }
        .nav-menu a { color: #fff; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }
        .menu-toggle { display: none; color: var(--red); font-size: 22px; cursor: pointer; }

        /* --- MAIN LAYOUT --- */
        main { max-width: 1200px; margin: 60px auto; padding: 0 20px; display: grid; grid-template-columns: 420px 1fr; gap: 60px; }

        /* --- 3D FLOATING ILLUSION CARD --- */
        .card-container { perspective: 2000px; position: sticky; top: 140px; }
        
        .card { 
            background: var(--card); 
            border: 1px solid rgba(255, 255, 255, 0.12); 
            border-radius: 40px; 
            padding: 60px 40px; 
            text-align: center; 
            backdrop-filter: blur(25px); 
            /* Double Shadow for 3D depth */
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.5),
                0 40px 100px rgba(0,0,0,0.8),
                inset 0 0 20px rgba(255,255,255,0.02);
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(-8deg); /* Default 3D angle */
            transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .card:hover {
            transform: rotateX(0deg) rotateY(0deg) translateZ(30px);
        }

        /* Elements popping out */
        .profile-wrapper { 
            position: relative; width: 150px; height: 150px; margin: 0 auto 30px; 
            display: flex; align-items: center; justify-content: center;
            transform: translateZ(80px); /* Massive pop out */
        }
        
        .circle-svg { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); transform: rotate(-90deg); }
        .circle-svg circle { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 500; animation: pulseStroke 3s infinite; }
        @keyframes pulseStroke { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        .profile-photo { 
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover; 
            border: 6px solid #000; box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .name-container { 
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 30px;
            transform: translateZ(50px);
        }
        .card-name { font-family: 'Montserrat', sans-serif; font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: 1px; }
        
        .verify-badge { 
            width: 22px; height: 22px; background: var(--verify-blue); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            position: relative; border: 2px solid #fff;
        }
        .verify-badge i { color: #fff; font-size: 12px; }

        /* --- BUTTONS --- */
        .socials { display: flex; flex-direction: column; gap: 15px; transform: translateZ(30px); }
        .social-pill { 
            padding: 16px; border-radius: 18px; background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.08); color: #fff; text-decoration: none; 
            font-weight: 700; font-size: 0.9rem; transition: 0.3s;
        }
        .social-pill:hover { background: rgba(255,255,255,0.08); transform: translateZ(15px); }

        .email-btn { 
            background: var(--gold) !important; color: #000 !important; font-weight: 900 !important;
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.4); border: none !important;
            position: relative; overflow: hidden;
        }
        .email-btn::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { left: -100%; } 100% { left: 100%; } }

        /* --- CONTENT --- */
        h1 { font-family: 'Montserrat', sans-serif; font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; margin-bottom: 40px; letter-spacing: -3px; }
        .bio { background: rgba(255, 255, 255, 0.02); border-radius: 30px; padding: 45px; border-left: 5px solid var(--red); line-height: 1.8; font-size: 1.15rem; color: #ccc; }

        .gallery-header { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.2rem; margin: 60px 0 30px; display: flex; align-items: center; gap: 20px; }
        .gallery-header::after { content: ""; flex: 1; height: 1px; background: rgba(255,0,0,0.2); }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { aspect-ratio: 4/5; overflow: hidden; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-item:hover img { transform: scale(1.1); }

        /* --- MOBILE --- */
        @media (max-width: 900px) {
            nav { height: 80px; }
            .menu-toggle { display: block; }
            .nav-menu { display: none; position: absolute; top: 80px; left: 0; width: 100%; background: #000; flex-direction: column; padding: 40px; border-bottom: 2px solid var(--red); }
            .nav-menu.active { display: flex; }
            main { grid-template-columns: 1fr; margin-top: 20px; }
            .card-container { position: relative; top: 0; margin: 0 10px 40px; perspective: 1500px; }
            .card { 
                transform: rotateX(10deg) rotateY(0deg); /* Forced 3D tilt on mobile */
                padding: 40px 20px;
            }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            h1 { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <nav>
        <div class="nav-inner">
            <img src="image/Logo.png" class="logo" alt="Logo">
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="index.html#packages">ACADEMY</a></li>
                <li><a href="index.html#apply">APPLY</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="card-container">
            <aside class="card">
                <div class="profile-wrapper">
                    <svg class="circle-svg" viewBox="0 0 170 170">
                        <circle cx="85" cy="85" r="80"></circle>
                    </svg>
                    <img src="image/filip.jpg" class="profile-photo" alt="Filippos">
                </div>
                
                <div class="name-container">
                    <div class="card-name">FILIPPOS</div>
                    <div class="verify-badge">
                        <i class="fas fa-check"></i>
                    </div>
                </div>
                
                <div class="socials">
                    <a class="social-pill" href="#"><i class="fab fa-spotify"></i> Spotify</a>
                    <a class="social-pill" href="https://www.tiktok.com/@filippos_tailakidis"><i class="fab fa-tiktok"></i> TikTok</a>
                    <a class="social-pill" href="https://www.instagram.com/tailakidis_"><i class="fab fa-instagram"></i> Instagram</a>
                    <a class="social-pill email-btn" href="mailto:filippostailakidis@outlook.de">
                        <i class="fas fa-envelope"></i> EMAIL ME
                    </a>
                </div>
            </aside>
        </div>

        <section>
            <h1>FILIPPOS TAILAKIDIS</h1>
            <div class="bio">
                <p>Entrepreneur and code visionary, founder of Legacy Academy. I build legacy-grade systems that bridge strategic engineering with uncompromising design.</p>
            </div>
            
            <div class="gallery-header">GALLERY</div>
            <div class="gallery">
                <div class="gallery-item"><img src="image/gallery1.jpg"></div>
                <div class="gallery-item"><img src="image/gallery2.jpg"></div>
                <div class="gallery-item"><img src="image/gallery3.jpg"></div>
                <div class="gallery-item"><img src="image/gallery4.jpg"></div>
                <div class="gallery-item"><img src="image/gallery5.jpg"></div>
            </div>
        </section>
    </main>

    <script>
        function toggleMenu() { document.getElementById("navMenu").classList.toggle("active"); }

        // Touch Interaction for 3D on Mobile
        const card = document.querySelector('.card');
        document.addEventListener('touchstart', (e) => {
            card.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(20px)";
        });
        document.addEventListener('touchend', () => {
            card.style.transform = "rotateX(10deg) rotateY(0deg)";
        });
    </script>
</body>
</html>
