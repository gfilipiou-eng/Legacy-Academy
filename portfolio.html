<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filippos Tailakidis — Portfolio</title>

<!-- Fonts + Icons -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --gold:#c5a059;
  --gold-bright:#f1d592;
  --muted:#bdbdbd;
  --bg:#000;
  --card:#0b0b0b;
  --nav-h:84px;
  --max-width:1250px;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
}

/* Reset */
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#fff;
  font-family:var(--font);
  padding-top:var(--nav-h);
  overflow-x:hidden;
}

/* ============================
   NAVBAR
   ============================ */
nav{
  position:fixed;
  top:0;left:0;right:0;
  height:var(--nav-h);
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.nav-inner{
  width:100%;
  max-width:var(--max-width);
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  height:64px;
  filter:drop-shadow(0 0 10px rgba(197,160,89,0.4));
}
.menu{
  display:flex;
  gap:36px;
}
.menu a{
  color:#fff;
  text-decoration:none;
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  letter-spacing:1.5px;
  font-size:15px;
  position:relative;
}
.menu a::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:0;
  width:0;
  height:2px;
  background:var(--gold);
  transition:.3s;
}
.menu a:hover::after{width:100%}

/* ⭐ HIDE APPLY ONLY ON PORTFOLIO */
body.portfolio-page .menu a[href="apply.html"]{
  display:none !important;
}

/* ============================
   LAYOUT
   ============================ */
main{
  max-width:var(--max-width);
  margin:40px auto;
  padding:20px;
  display:grid;
  grid-template-columns:1fr 420px;
  gap:40px;
}
@media(max-width:900px){
  main{grid-template-columns:1fr}
}

/* ============================
   LEFT SIDE
   ============================ */
h1{
  font-family:'Montserrat',sans-serif;
  font-size:34px;
  font-weight:900;
  letter-spacing:1.5px;
}
.subtitle{
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:13px;
  margin-bottom:25px;
}

/* Gallery */
.gallery-title{
  color:var(--gold);
  font-family:'Montserrat',sans-serif;
  font-size:18px;
  margin-bottom:12px;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
@media(max-width:900px){
  .gallery{grid-template-columns:repeat(2,1fr)}
}
.gallery-item{
  position:relative;
  width:100%;
  padding-bottom:100%;
  border-radius:12px;
  overflow:hidden;
  background:#111;
  border:1px solid rgba(255,255,255,0.1);
  cursor:pointer;
}
.gallery-item img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .25s ease;
}
.gallery-item:hover img{
  transform:scale(1.06);
}

/* ============================
   PROFILE CARD
   ============================ */
.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:25px;
  text-align:center;
}
.badge{
  display:inline-block;
  background:var(--gold);
  color:#000;
  padding:8px 14px;
  border-radius:999px;
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:15px;
}

/* Neon blob */
.photo-wrap{
  position:relative;
  width:200px;
  height:200px;
  margin:0 auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* GOLD ROTATING GLOW — 1:1 PREMIUM VERSION */
.blob{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,
    rgba(255,220,150,0.95),
    rgba(210,170,90,0.85),
    rgba(150,110,50,0.55),
    rgba(0,0,0,0.25)
  );
  filter:blur(45px);
  opacity:0.75;
  animation:goldSpin 14s ease-in-out infinite;
  z-index:1;
}

@keyframes goldSpin{
  0%{
    transform:rotate(0deg) scale(1);
    filter:blur(45px);
  }
  50%{
    transform:rotate(180deg) scale(1.18);
    filter:blur(55px);
  }
  100%{
    transform:rotate(360deg) scale(1);
    filter:blur(45px);
  }
}
/* Profile photo */
.profile-photo{
  position:relative;
  z-index:3;
  width:160px;
  height:160px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid rgba(255,255,255,0.15);
  cursor:pointer;
}

/* Text */
.name{
  font-family:'Montserrat',sans-serif;
  font-size:24px;
  font-weight:900;
  letter-spacing:1.2px;
  margin-top:10px;
}
.role{
  color:var(--gold);
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
  font-weight:800;
  margin-bottom:20px;
}

/* Social buttons */
.socials{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}
.social-pill{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
  color:#000;
  font-weight:800;
  text-decoration:none;
  min-width:110px;
  justify-content:center;
}

/* ============================
   LIGHTBOX / ZOOM
   ============================ */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999999;
  touch-action:none;
}
.modal.show{display:flex}
.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:12px;
  touch-action:none;
}
.modal-close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:40px;
  color:#fff;
  cursor:pointer;
  z-index:1000000;
}
</style>
</head>

<body class="portfolio-page">

<!-- NAVBAR -->
<nav>
  <div class="nav-inner">
    <img src="image/Logo.png" class="logo" alt="Logo">
    <div class="menu">
      <a href="index.html">HOME</a>
      <a href="apply.html">APPLY</a> <!-- Will be hidden -->
      <a href="portfolio.html">PORTFOLIO</a>
    </div>
  </div>
</nav>

<main>

<!-- LEFT -->
<section>
  <h1>FILIPPOS TAILAKIDIS</h1>
  <div class="subtitle">Private Portfolio — Founder · Programmer</div>

  <div class="gallery-title">Gallery</div>

  <div class="gallery">
    <div class="gallery-item" onclick="openModal('image/gallery1.jpg')"><img src="image/gallery1.jpg"></div>
    <div class="gallery-item" onclick="openModal('image/gallery2.jpg')"><img src="image/gallery2.jpg"></div>
    <div class="gallery-item" onclick="openModal('image/gallery3.jpg')"><img src="image/gallery3.jpg"></div>
    <div class="gallery-item" onclick="openModal('image/gallery4.jpg')"><img src="image/gallery4.jpg"></div>
    <div class="gallery-item" onclick="openModal('image/gallery5.jpg')"><img src="image/gallery5.jpg"></div>
  </div>
</section>

<!-- RIGHT -->
<aside class="card">

  <div class="badge">FOUNDER</div>

  <div class="photo-wrap">
    <div class="blob"></div>
    <img src="image/filip.jpg" class="profile-photo" onclick="openModal('image/filip.jpg')">
  </div>

  <div class="name">FILIPPOS TAILAKIDIS</div>
  <div class="role">Founder · Programmer</div>

  <div class="socials">
    <a class="social-pill" href="https://open.spotify.com/user/31dcojj2flngqkzytjsq3i5wj75i" target="_blank"><i class="fab fa-spotify"></i> Spotify</a>
    <a class="social-pill" href="https://www.tiktok.com/@filippos_tailakidis" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
    <a class="social-pill" href="https://www.instagram.com/tailakidis_" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
    <a class="social-pill" href="https://youtube.com/@filippostailakidis_" target="_blank"><i class="fab fa-youtube"></i> YouTube</a>
    <a class="social-pill" href="mailto:filippostailakidis@outlook.de"><i class="fas fa-envelope"></i> Email</a>
  </div>

</aside>

</main>

<!-- MODAL -->
<div class="modal" id="modal">
  <span class="modal-close" onclick="closeModal()">✕</span>
  <img id="modalImg">
</div>

<script>
let scale = 1;
let posX = 0, posY = 0;
let startX = 0, startY = 0;
let lastDist = 0;

function openModal(src){
  const modal = document.getElementById("modal");
  const img = document.getElementById("modalImg");
  img.src = src;
  modal.classList.add("show");
  scale = 1;
  posX = posY = 0;
  img.style.transform = "translate(0px,0px) scale(1)";
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

const modalImg = document.getElementById("modalImg");

modalImg.addEventListener("touchstart", e=>{
  if(e.touches.length === 1){
    startX = e.touches[0].clientX - posX;
    startY = e.touches[0].clientY - posY;
  } else if(e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastDist = Math.hypot(dx, dy);
  }
});

modalImg.addEventListener("touchmove", e=>{
  e.preventDefault();

  if(e.touches.length === 1){
    posX = e.touches[0].clientX - startX;
    posY = e.touches[0].clientY - startY;
  } 
  else if(e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    scale += (dist - lastDist) * 0.005;
    scale = Math.max(1, Math.min(scale, 4));
    lastDist = dist;
  }

  modalImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}, {passive:false});
</script>

</body>
</html>
