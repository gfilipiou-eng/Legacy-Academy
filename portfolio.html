<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Filippos Tailakidis — Portfolio</title>
    
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --gold: #c5a059;
            --red: #ff0000;
            --verify-blue: #0095f6;
            --bg: #000000;
            --glass-border: rgba(255, 255, 255, 0.15);
            --nav-h: 100px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #e9e9e9; font-family: 'Inter', sans-serif; padding-top: var(--nav-h); overflow-x: hidden; }

        /* --- BACKGROUND --- */
        .bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; }
        .bg-gradient::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: linear-gradient(rgba(255, 0, 0, 0.08) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255, 0, 0, 0.08) 1.5px, transparent 1.5px);
            background-size: 60px 60px; transform: perspective(500px) rotateX(60deg); animation: gridMove 15s linear infinite;
        }
        @keyframes gridMove { from { transform: translateY(0); } to { transform: translateY(60px); } }

        /* --- NAVIGATION --- */
        nav { position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10000; display: flex; align-items: center; }
        .nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 25px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 65px; display: block; }
        .nav-menu { display: flex; gap: 35px; list-style: none; }
        .nav-menu a { color: #fff; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; transition: 0.3s; }
        .nav-menu a:hover { opacity: 1; color: var(--red); }
        .menu-toggle { display: none; color: var(--red); font-size: 24px; cursor: pointer; }

        /* --- MAIN LAYOUT --- */
        main { max-width: 1200px; margin: 40px auto 60px; padding: 0 20px; display: grid; grid-template-columns: 420px 1fr; gap: 60px; }

        /* --- 3D CARD (DRAG) --- */
        .card-container { perspective: 2000px; position: sticky; top: 140px; z-index: 100; cursor: grab; }
        .card-container:active { cursor: grabbing; }
        .card { 
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 40px; 
            padding: 50px 30px; text-align: center; backdrop-filter: blur(30px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); transform-style: preserve-3d; transition: transform 0.1s ease-out; pointer-events: none;
        }

        .profile-wrapper { position: relative; width: 150px; height: 150px; margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; transform: translateZ(60px); pointer-events: auto; }
        .circle-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-svg circle { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 500; opacity: 0.7; }
        .profile-photo { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 6px solid #000; position: relative; z-index: 2; }

        .name-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 25px; transform: translateZ(40px); pointer-events: auto; }
        .card-name { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 900; color: #fff; }
        .verify-badge-3d { width: 22px; height: 22px; background: var(--verify-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        .verify-badge-3d i { color: #fff; font-size: 11px; }

        /* --- SOCIAL BUTTONS --- */
        .socials { display: flex; flex-direction: column; gap: 12px; transform: translateZ(25px); pointer-events: auto; }
        .social-pill { 
            display: flex; align-items: center; justify-content: center; gap: 12px; 
            padding: 15px; border-radius: 18px; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; text-decoration: none; 
            font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.1s ease; cursor: pointer;
        }
        .social-pill:active { transform: scale(0.9) translateZ(10px); background: rgba(255, 255, 255, 0.1); }
        .social-pill.email-btn { background: var(--gold) !important; color: #000 !important; font-weight: 900 !important; border: none !important; }

        /* --- CONTENT --- */
        h1 { font-family: 'Montserrat', sans-serif; font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 900; margin-bottom: 40px; letter-spacing: -3px; }
        .bio { background: rgba(255, 255, 255, 0.02); border-radius: 30px; padding: 45px; border-left: 5px solid var(--red); line-height: 1.9; font-size: 1.15rem; color: #ccc; margin-bottom: 60px; }

        /* --- GALLERY --- */
        .gallery-header { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.2rem; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .gallery-header i { color: var(--red); }
        .gallery-header::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1); }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { aspect-ratio: 1/1; overflow: hidden; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .gallery-item:hover img { transform: scale(1.1); }

        /* --- MODAL --- */
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98); display: none; align-items: center; justify-content: center; z-index: 100000; backdrop-filter: blur(15px); padding: 20px; }
        .modal.show { display: flex; }
        .modal img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .modal-close { position: absolute; top: 30px; right: 30px; font-size: 35px; color: #fff; cursor: pointer; }

        /* --- MOBILE --- */
        @media (max-width: 900px) {
            nav { height: 80px; } .logo { height: 50px; }
            .menu-toggle { display: block; }
            .nav-menu { display: none; position: absolute; top: 80px; left: 0; width: 100%; background: #000; flex-direction: column; padding: 40px; text-align: center; border-bottom: 2px solid var(--red); }
            .nav-menu.active { display: flex; }
            main { grid-template-columns: 1fr; margin-top: 20px; }
            .card-container { position: relative; top: 0; margin: 0 auto 40px; width: 100%; max-width: 400px; touch-action: pan-y; }
            h1 { text-align: center; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <nav>
        <div class="nav-inner">
            <img src="image/Logo.png" class="logo" alt="Logo">
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">HOME</a></li>
                <li><a href="index.html#packages">ACADEMY</a></li>
                <li><a href="index.html#apply">APPLY</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="card-container" id="cardContainer">
            <aside class="card" id="tiltCard">
                <div class="profile-wrapper">
                    <svg class="circle-svg" viewBox="0 0 150 150">
                        <circle cx="75" cy="75" r="72"></circle>
                    </svg>
                    <img src="image/filip.jpg" class="profile-photo" alt="Filippos">
                </div>
                
                <div class="name-container">
                    <div class="card-name">FILIPPOS</div>
                    <div class="verify-badge-3d"><i class="fas fa-check"></i></div>
                </div>
                
                <div class="socials">
                    <a class="social-pill" href="http://googleusercontent.com/spotify.com/8" target="_blank" onclick="playClick()"><i class="fab fa-spotify"></i> Spotify</a>
                    <a class="social-pill" href="https://www.tiktok.com/@filippos_tailakidis" target="_blank" onclick="playClick()"><i class="fab fa-tiktok"></i> TikTok</a>
                    <a class="social-pill" href="https://www.instagram.com/tailakidis_" target="_blank" onclick="playClick()"><i class="fab fa-instagram"></i> Instagram</a>
                    <a class="social-pill" href="https://youtube.com/@filippostailakidis_" target="_blank" onclick="playClick()"><i class="fab fa-youtube"></i> YouTube</a>
                    <a class="social-pill email-btn" href="mailto:filippostailakidis@outlook.de" onclick="playClick()">Email Me</a>
                </div>
            </aside>
        </div>

        <section>
            <h1>FILIPPOS TAILAKIDIS</h1>
            <div class="bio">
                <p>Entrepreneur and code visionary, founder of Legacy Academy. I build legacy-grade systems that bridge strategic engineering with uncompromising design.</p>
            </div>

            <div class="gallery-header"><i class="fas fa-camera-retro"></i> Gallery</div>
            <div class="gallery">
                <div class="gallery-item" onclick="openModal('image/gallery1.jpg')"><img src="image/gallery1.jpg"></div>
                <div class="gallery-item" onclick="openModal('image/gallery2.jpg')"><img src="image/gallery2.jpg"></div>
                <div class="gallery-item" onclick="openModal('image/gallery3.jpg')"><img src="image/gallery3.jpg"></div>
                <div class="gallery-item" onclick="openModal('image/gallery4.jpg')"><img src="image/gallery4.jpg"></div>
                <div class="gallery-item" onclick="openModal('image/gallery5.jpg')"><img src="image/gallery5.jpg"></div>
            </div>
        </section>
    </main>

    <div class="modal" id="modal">
        <span class="modal-close" onclick="closeModal()">✕</span>
        <img id="modalImg" src="">
    </div>

    <audio id="clickSound" src="https://www.soundjay.com/buttons/button-50.mp3" preload="auto"></audio>

    <script>
        function toggleMenu() { document.getElementById("navMenu").classList.toggle("active"); }
        function openModal(src) { const m = document.getElementById("modal"); document.getElementById("modalImg").src = src; m.classList.add("show"); document.body.style.overflow = 'hidden'; }
        function closeModal() { const m = document.getElementById("modal"); m.classList.remove("show"); document.body.style.overflow = 'auto'; }
        document.getElementById("modal").addEventListener("click", function (e) { if (e.target === this) closeModal(); });

        const card = document.getElementById('tiltCard');
        const container = document.getElementById('cardContainer');
        const clickSound = document.getElementById('clickSound');

        function playClick() { clickSound.currentTime = 0; clickSound.play(); }

        // --- DRAG ENGINE ---
        let isDragging = false;
        let startX, startY;

        const startDragging = (e) => {
            isDragging = true;
            startX = (e.touches ? e.touches[0].pageX : e.pageX);
            startY = (e.touches ? e.touches[0].pageY : e.pageY);
        };

        const stopDragging = () => {
            isDragging = false;
            card.style.transition = "transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)";
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            setTimeout(() => card.style.transition = "transform 0.1s ease-out", 600);
        };

        const moveCard = (e) => {
            if (!isDragging) return;
            const x = (e.touches ? e.touches[0].pageX : e.pageX);
            const y = (e.touches ? e.touches[0].pageY : e.pageY);
            const diffX = (x - startX) * 0.15;
            const diffY = (startY - y) * 0.15;
            card.style.transform = `rotateY(${diffX}deg) rotateX(${diffY}deg)`;
        };

        container.addEventListener('mousedown', startDragging);
        container.addEventListener('touchstart', startDragging, {passive: true});
        window.addEventListener('mousemove', moveCard);
        window.addEventListener('touchmove', moveCard, {passive: false});
        window.addEventListener('mouseup', stopDragging);
        window.addEventListener('touchend', stopDragging);
    </script>
</body>
</html>
